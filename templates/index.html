<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Widget AI</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0f0f0f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Widget AI">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2309090b'/><text y='.9em' font-size='65' x='18' fill='%235eead4' font-family='monospace' font-weight='bold'>&gt;_</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f0f0f;
            --bg-dark-secondary: #161616;
            --surface-dark: rgba(255, 255, 255, 0.06);
            --surface-dark-hover: rgba(255, 255, 255, 0.12);
            --border-dark: rgba(255, 255, 255, 0.08);
            --text-dark: #e5e5e5;
            --text-dark-muted: #8e8e8e;
            --primary-dark: #10a37f;

            --bg-light: #f7f7f8;
            --bg-light-secondary: #ffffff;
            --surface-light: rgba(0, 0, 0, 0.04);
            --surface-light-hover: rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.08);
            --text-light: #111111;
            --text-light-muted: #6b6b6b;
            --primary-light: #0d9678;

            --bg: var(--bg-dark);
            --bg-secondary: var(--bg-dark-secondary);
            --surface: var(--surface-dark);
            --surface-hover: var(--surface-dark-hover);
            --border: var(--border-dark);
            --text: var(--text-dark);
            --text-muted: var(--text-dark-muted);
            --primary: var(--primary-dark);
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }

        body.light-mode {
            --bg: var(--bg-light);
            --bg-secondary: var(--bg-light-secondary);
            --surface: var(--surface-light);
            --surface-hover: var(--surface-light-hover);
            --border: var(--border-light);
            --text: var(--text-light);
            --text-muted: var(--text-light-muted);
            --primary: var(--primary-light);
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
        }

        .sidebar-hover-zone {
            position: fixed;
            top: 0;
            left: 0;
            width: 16px;
            height: 100dvh;
            z-index: 999;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100dvh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: 20px 14px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
        }

        .sidebar:hover,
        .sidebar-hover-zone:hover + .sidebar,
        .sidebar.mobile-open {
            transform: translateX(0);
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .new-chat-btn:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
        }

        .new-chat-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        .history-section-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding-left: 6px;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.15s ease;
        }

        .history-item:hover {
            background: var(--surface);
            color: var(--text);
        }

        .history-item.active {
            background: var(--surface-hover);
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-left: 6px;
        }

        .sidebar-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .sidebar-close {
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            border-radius: 9px;
            color: var(--text-muted);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
        }

        .sidebar-close:hover {
            background: var(--surface);
            color: var(--text);
        }

        .sidebar.force-hide {
            transform: translateX(-100%) !important;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .history-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 3px;
            border-radius: 6px;
            display: grid;
            place-items: center;
            opacity: 0;
            flex-shrink: 0;
            transition: opacity 0.15s ease, color 0.15s ease;
        }

        .history-item:hover .history-delete { opacity: 1; }
        .history-delete:hover { color: #ef4444; background: var(--surface); }

        .history-delete svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .history-empty {
            padding: 8px 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (hover: none) {
            .history-delete { opacity: 0.7; }
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sidebar-btn:hover {
            background: var(--surface);
        }

        .sidebar-btn svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        header {
            position: fixed;
            top: 16px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .sidebar-toggle {
            pointer-events: auto;
            width: 38px;
            height: 38px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 11px;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--surface-hover);
        }

        .sidebar-toggle svg,
        .sidebar-close svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle {
            pointer-events: auto;
            width: 38px;
            height: 38px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 11px;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
            color: var(--text);
            margin-left: auto;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        .header-brand {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 110;
            cursor: pointer;
            pointer-events: auto;
            text-align: center;
            transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        left 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        top 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        gap 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-logo {
            width: 62px;
            height: 62px;
            background: var(--primary);
            border-radius: 18px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            box-shadow: 0 12px 28px rgba(16, 163, 127, 0.28);
            transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        border-radius 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-logo svg {
            width: 30px;
            height: 30px;
            fill: var(--bg);
            transition: width 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                        height 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: font-size 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            font-weight: 500;
            opacity: 1;
            transition: opacity 0.25s ease;
        }

        body.chat-active .header-brand {
            top: 16px;
            left: 68px;
            transform: translate(0, 0);
            flex-direction: row;
            gap: 10px;
            text-align: left;
        }

        body.chat-active:has(.sidebar:hover) .header-brand,
        body.chat-active:has(.sidebar-hover-zone:hover) .header-brand {
            left: calc(var(--sidebar-width) + 24px);
        }

        body.chat-active .brand-logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            box-shadow: none;
        }

        body.chat-active .brand-logo svg {
            width: 20px;
            height: 20px;
        }

        body.chat-active .brand-titles {
            align-items: flex-start;
        }

        body.chat-active h1 {
            font-size: 1.25rem;
            letter-spacing: -0.3px;
        }

        body.chat-active .brand-subtitle {
            display: none;
            opacity: 0;
        }

        .workspace {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 72px 16px 12px 16px;
            min-height: 0;
            position: relative;
        }

        .chat-viewport {
            width: 100%;
            max-width: 900px;
            flex: 1;
            position: relative;
            min-height: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        body.chat-active .chat-viewport {
            opacity: 1;
            pointer-events: auto;
        }

        #chat-container {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--surface) transparent;
            mask-image: linear-gradient(to bottom, transparent 0%, black 28px, black calc(100% - 28px), transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 28px, black calc(100% - 28px), transparent 100%);
        }

        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 2px; }

        .input-wrapper {
            width: 100%;
            max-width: 760px;
            padding: 0 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                        max-width 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 105;
        }

        body.chat-active .input-wrapper {
            position: relative;
            bottom: auto;
            left: auto;
            transform: none;
            max-width: 900px;
        }

        .input-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 10px 8px 18px;
            transition: border-color 0.2s ease, background 0.2s ease, padding 0.25s ease;
        }

        body.chat-active .input-box {
            padding: 6px 8px 6px 16px;
        }

        .input-box:focus-within {
            border-color: var(--primary);
            background: var(--surface-hover);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.96rem;
            font-weight: 500;
            color: var(--text);
            resize: none;
            height: 26px;
            min-height: 26px;
            max-height: 120px;
            line-height: 26px;
            padding: 0;
            margin: 0;
            display: block;
        }

        body.chat-active textarea {
            font-size: 0.92rem;
            height: 24px;
            min-height: 24px;
            max-height: 100px;
            line-height: 24px;
        }

        textarea::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
            line-height: inherit;
        }

        .send-btn {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            transition: opacity 0.2s ease;
        }

        body.chat-active .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 11px;
        }

        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .send-btn svg { width: 17px; height: 17px; fill: white; }

        .quick-chips-container {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
            transition: opacity 0.35s ease;
        }

        body.chat-active .quick-chips-container {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .input-bottom-bar {
            width: 100%;
            display: none;
            justify-content: flex-end;
            padding: 5px 12px 0 12px;
        }

        body.chat-active .input-bottom-bar {
            display: flex;
        }

        .model-tag {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.2px;
            user-select: none;
        }

        .message-group {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            animation: slideIn 0.2s ease-out;
        }

        .message-group.user { justify-content: flex-end; }
        .message-group.bot { justify-content: flex-start; }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 84%;
        }

        .message-group.user .message-wrapper { align-items: flex-end; }
        .message-group.bot .message-wrapper { align-items: flex-start; }

        .message {
            padding: 11px 16px;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.5;
            font-weight: 500;
            word-wrap: break-word;
        }

        .user-message {
            background: var(--primary);
            color: #ffffff;
            border-radius: 18px 4px 18px 18px;
        }

        .bot-message {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px 18px 18px 18px;
        }

        .bot-message p { margin-bottom: 8px; }
        .bot-message p:last-child { margin-bottom: 0; }
        .bot-message ul, .bot-message ol { margin: 6px 0 8px 18px; }
        .bot-message li { margin-bottom: 4px; }
        .bot-message code {
            background: rgba(0, 0, 0, 0.26);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        body.light-mode .bot-message code { background: rgba(0, 0, 0, 0.08); }

        .bot-message pre {
            background: rgba(0, 0, 0, 0.35);
            padding: 10px 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        body.light-mode .bot-message pre { background: rgba(0, 0, 0, 0.06); }
        .bot-message pre code { background: transparent; padding: 0; }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 4px;
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .copy-btn svg { width: 11px; height: 11px; fill: currentColor; }

        .thinking {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }

        .thinking-dot {
            width: 5px;
            height: 5px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            place-items: center;
            padding: 16px;
        }

        .modal-overlay.active { display: grid; }

        .modal {
            width: 100%;
            max-width: 380px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
        }

        .modal-header h2 { font-size: 1.15rem; font-weight: 700; }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 8px;
            transition: color 0.2s ease;
        }

        .close-modal-btn:hover {
            color: var(--text);
        }

        .close-modal-btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .setting-row:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .setting-info label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
        }

        .setting-info span {
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
            flex-shrink: 0;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: var(--surface-dark-hover);
            border: 1px solid var(--border);
            transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 50%;
        }

        body.light-mode .slider {
            background-color: rgba(0, 0, 0, 0.12);
        }

        input:checked + .slider {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .primary-btn {
            background: var(--primary);
            border: none;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .primary-btn:hover { opacity: 0.85; }

        .danger-btn {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .danger-btn:hover {
            background: #ef4444;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            header {
                top: 14px;
                left: 16px;
                right: 16px;
            }

            .header-brand {
                top: 45%;
                left: 50%;
                transform: translate(-50%, -50%);
                gap: 12px;
            }

            .brand-logo {
                width: 56px;
                height: 56px;
                border-radius: 16px;
            }

            .brand-logo svg {
                width: 26px;
                height: 26px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .brand-subtitle {
                font-size: 0.84rem;
            }

            body.chat-active .header-brand {
                top: 14px;
                left: 62px;
                transform: none;
                gap: 8px;
            }

            body.chat-active .brand-logo {
                width: 34px;
                height: 34px;
                border-radius: 9px;
            }

            body.chat-active .brand-logo svg {
                width: 18px;
                height: 18px;
            }

            body.chat-active h1 {
                font-size: 1.15rem;
            }

            .workspace {
                padding: 64px 8px 12px 8px;
            }

            .input-wrapper {
                bottom: 16px;
                width: calc(100% - 16px);
                max-width: 100%;
            }

            body.chat-active .input-wrapper {
                width: 100%;
            }

            .quick-chips-container {
                display: none !important;
            }

            .message-wrapper { max-width: 90%; }
            .sidebar-hover-zone { display: none; }
            .sidebar { width: 250px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-hover-zone" id="hover-zone"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <span class="sidebar-title">Widget AI</span>
            <button class="sidebar-close" id="sidebar-close" aria-label="Close sidebar">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
            </button>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Chat
        </button>

        <div class="history-section-title">Recent Chats</div>
        <div class="history-list" id="history-list"></div>

        <div class="sidebar-bottom">
            <button class="sidebar-btn" id="open-settings-btn">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </button>
        </div>
    </aside>

    <header>
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"></rect><line x1="9" y1="4" x2="9" y2="20"></line></svg>
        </button>

        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <svg id="theme-icon" viewBox="0 0 24 24"></svg>
        </button>
    </header>

    <div class="header-brand" id="header-brand">
        <div class="brand-logo">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
            </svg>
        </div>
        <div class="brand-titles">
            <h1>Widget AI</h1>
            <span class="brand-subtitle">What do you want to know today?</span>
        </div>
    </div>

    <main class="workspace" id="workspace">
        <div class="chat-viewport">
            <div id="chat-container"></div>
        </div>

        <div class="input-wrapper" id="input-wrapper">
            <form class="input-box glass" id="chat-form">
                <textarea id="user-input" rows="1" placeholder="Ask anything... (Enter to send)" required></textarea>
                <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </form>

            <div class="quick-chips-container" id="quick-chips"></div>

            <div class="input-bottom-bar">
                <span class="model-tag">gpt-oss-20b</span>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal glass">
            <div class="modal-header">
                <h2>Settings</h2>
                <button class="close-modal-btn" id="close-settings-btn" aria-label="Close settings">
                    <svg viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            
            <div class="setting-row" id="install-row" style="display:none">
                <div class="setting-info">
                    <label>Install App</label>
                    <span>Add Widget AI to your home screen</span>
                </div>
                <button class="primary-btn" id="install-btn" type="button">Install</button>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <label>Typing Animation</label>
                    <span>Simulate word stream effect</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="stream-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <label>Clear Data</label>
                    <span>Reset stored conversation history</span>
                </div>
                <button class="danger-btn" onclick="clearAllHistory()">Reset</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const sidebar = document.getElementById('sidebar');
        const headerBrand = document.getElementById('header-brand');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const modalOverlay = document.getElementById('modal-overlay');
        const openSettingsBtn = document.getElementById('open-settings-btn');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const quickChips = document.getElementById('quick-chips');
        const inputWrapper = document.getElementById('input-wrapper');
        const historyList = document.getElementById('history-list');
        const sidebarClose = document.getElementById('sidebar-close');

        // ---- Chat memory + saved chats (localStorage) ----
        const CHATS_KEY = 'widgetai_chats';
        const CURRENT_KEY = 'widgetai_current';
        const MAX_SAVED_CHATS = 50;

        let chatHistory = [];     // messages of the open chat, sent with every request
        let currentChatId = null;

        function readChats() {
            try {
                const data = JSON.parse(localStorage.getItem(CHATS_KEY));
                return Array.isArray(data) ? data : [];
            } catch (e) {
                return [];
            }
        }

        function writeChats(chats) {
            try { localStorage.setItem(CHATS_KEY, JSON.stringify(chats)); } catch (e) {}
        }

        function setCurrentId(id) {
            currentChatId = id;
            try {
                if (id) localStorage.setItem(CURRENT_KEY, id);
                else localStorage.removeItem(CURRENT_KEY);
            } catch (e) {}
        }

        function newChatId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function makeTitle(messages) {
            const first = messages.find(m => m.role === 'user');
            const text = first ? first.content.replace(/\s+/g, ' ').trim() : 'New chat';
            return text.length > 40 ? text.slice(0, 40) + '…' : text;
        }

        function saveChat(id, messages) {
            const chats = readChats();
            const idx = chats.findIndex(c => c.id === id);

            if (!messages.length) {
                if (idx !== -1) chats.splice(idx, 1);
            } else if (idx === -1) {
                chats.push({ id, title: makeTitle(messages), messages, updated: Date.now() });
            } else {
                chats[idx].messages = messages;
                chats[idx].updated = Date.now();
            }

            chats.sort((a, b) => b.updated - a.updated);
            writeChats(chats.slice(0, MAX_SAVED_CHATS));
            renderHistoryList();
        }

        function renderHistoryList() {
            const chats = readChats();
            historyList.innerHTML = '';

            if (!chats.length) {
                const empty = document.createElement('div');
                empty.className = 'history-empty';
                empty.textContent = 'No saved chats yet';
                historyList.appendChild(empty);
                return;
            }

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');

                const title = document.createElement('span');
                title.className = 'history-title';
                title.textContent = chat.title;

                const del = document.createElement('button');
                del.className = 'history-delete';
                del.type = 'button';
                del.setAttribute('aria-label', 'Delete chat');
                del.innerHTML = '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';

                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    loadChat(chat.id);
                });

                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                });

                item.appendChild(title);
                item.appendChild(del);
                historyList.appendChild(item);
            });
        }

        function loadChat(id) {
            const chat = readChats().find(c => c.id === id);
            if (!chat) return;

            setCurrentId(id);
            chatHistory = chat.messages.slice();
            chatContainer.innerHTML = '';
            document.body.classList.add('chat-active');

            chatHistory.forEach(m => {
                if (m.role === 'user') {
                    appendMessage(m.content, 'user-message', false, m.time);
                } else {
                    const { msgDiv, metaDiv } = appendMessage('', 'bot-message', false, m.time);
                    msgDiv.innerHTML = marked.parse(m.content);
                    addCopyButton(metaDiv, m.content);
                }
            });

            sidebar.classList.remove('mobile-open');
            renderHistoryList();
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function deleteChat(id) {
            writeChats(readChats().filter(c => c.id !== id));
            if (id === currentChatId) {
                startNewChat();
            } else {
                renderHistoryList();
            }
        }

        function initChats() {
            renderHistoryList();
            let saved = null;
            try { saved = localStorage.getItem(CURRENT_KEY); } catch (e) {}
            if (saved) loadChat(saved);
        }

        const questionBank = [
            "Explain DNS resolution in simple terms",
            "Write a Python script to scrape website title",
            "Key differences between TCP and UDP",
            "How does public-key cryptography work?",
            "Explain Docker containers vs Virtual Machines",
            "What is the difference between SQL and NoSQL?",
            "Write a Bash command to find large files",
            "Explain the CAP theorem in system design",
            "How does garbage collection work in Python?",
            "Difference between REST APIs and GraphQL"
        ];

        function renderShuffledChips() {
            quickChips.innerHTML = '';
            const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 3);
            
            selected.forEach(prompt => {
                const btn = document.createElement('button');
                btn.className = 'chip';
                btn.type = 'button';
                btn.textContent = prompt;
                btn.onclick = () => submitChip(prompt);
                quickChips.appendChild(btn);
            });
        }

        renderShuffledChips();

        const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
        const sunIcon = `<circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`;

        function renderThemeIcon() {
            const isLight = document.body.classList.contains('light-mode');
            themeIcon.innerHTML = isLight ? sunIcon : moonIcon;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', isLight ? '#f7f7f8' : '#0f0f0f');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
        }
        renderThemeIcon();

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            renderThemeIcon();
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        });

        sidebarToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.remove('force-hide');
            sidebar.classList.toggle('mobile-open');
        });

        sidebarClose.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.remove('mobile-open');
            sidebar.classList.add('force-hide');
        });

        sidebar.addEventListener('mouseleave', () => sidebar.classList.remove('force-hide'));

        headerBrand.addEventListener('click', () => {
            if (document.body.classList.contains('chat-active')) {
                sidebar.classList.toggle('mobile-open');
            }
        });

        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target) && !headerBrand.contains(e.target)) {
                sidebar.classList.remove('mobile-open');
            }
        });

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const heightDiff = window.innerHeight - window.visualViewport.height;
                if (heightDiff > 120) {
                    const offset = heightDiff + 8;
                    inputWrapper.style.transform = `translateY(-${offset}px)`;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    inputWrapper.style.transform = '';
                }
            });
        }

        input.addEventListener('input', () => {
            const baseH = document.body.classList.contains('chat-active') ? 24 : 26;
            input.style.height = baseH + 'px';
            input.style.height = Math.min(input.scrollHeight, 100) + 'px';
            const box = input.closest('.input-box');
            box.style.alignItems = input.scrollHeight > 36 ? 'flex-end' : 'center';
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });

        openSettingsBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
        closeSettingsBtn.addEventListener('click', () => modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) modalOverlay.classList.remove('active');
        });

        function clearAllHistory() {
            modalOverlay.classList.remove('active');
            if (!confirm('Delete all saved chats?')) return;
            try { localStorage.removeItem(CHATS_KEY); } catch (e) {}
            startNewChat();
        }

        function startNewChat() {
            chatHistory = [];
            setCurrentId(null);
            chatContainer.innerHTML = '';
            document.body.classList.remove('chat-active');
            sidebar.classList.remove('mobile-open');
            input.value = '';
            input.style.height = '26px';
            inputWrapper.style.transform = '';
            renderShuffledChips();
            renderHistoryList();
        }

        function getFormattedTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function appendMessage(text, className, isThinking = false, time = null) {
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${className === 'user-message' ? 'user' : 'bot'}`;

            const wrapper = document.createElement('div');
            wrapper.className = 'message-wrapper';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;

            if (isThinking) {
                msgDiv.innerHTML = '<div class="thinking"><div class="thinking-dot"></div><div class="thinking-dot"></div><div class="thinking-dot"></div></div>';
            } else {
                msgDiv.textContent = text;
            }

            const metaDiv = document.createElement('div');
            metaDiv.className = 'message-meta';

            const timeDiv = document.createElement('span');
            timeDiv.className = 'message-time';
            timeDiv.textContent = time || getFormattedTime();
            metaDiv.appendChild(timeDiv);

            wrapper.appendChild(msgDiv);
            wrapper.appendChild(metaDiv);
            messageGroup.appendChild(wrapper);
            chatContainer.appendChild(messageGroup);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return { msgDiv, metaDiv };
        }

        function addCopyButton(metaElement, textToCopy) {
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy';
            
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => {
                        copyBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy';
                    }, 2000);
                });
            });
            metaElement.appendChild(copyBtn);
        }

        function streamMarkdownText(element, fullText, metaElement) {
            const useStream = document.getElementById('stream-toggle').checked;
            element.classList.remove('thinking');

            if (!useStream) {
                element.innerHTML = marked.parse(fullText);
                addCopyButton(metaElement, fullText);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return;
            }

            const words = fullText.split(' ');
            let currentIndex = 0;
            element.innerHTML = '';

            const interval = setInterval(() => {
                if (currentIndex < words.length) {
                    const partial = words.slice(0, currentIndex + 1).join(' ');
                    element.innerHTML = marked.parse(partial);
                    currentIndex++;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                } else {
                    clearInterval(interval);
                    element.innerHTML = marked.parse(fullText);
                    addCopyButton(metaElement, fullText);
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }, 18);
        }

        function submitChip(text) {
            handleSubmit(text);
        }

        async function handleSubmit(message) {
            if (!document.body.classList.contains('chat-active')) {
                document.body.classList.add('chat-active');
            }

            if (!currentChatId) setCurrentId(newChatId());

            // local refs so a reply still lands in the right chat if the user switches chats mid-request
            const chatId = currentChatId;
            const history = chatHistory;
            const time = getFormattedTime();

            appendMessage(message, 'user-message', false, time);
            history.push({ role: 'user', content: message, time });
            saveChat(chatId, history);

            input.value = '';
            input.style.height = '24px';
            input.closest('.input-box').style.alignItems = 'center';
            sendBtn.disabled = true;

            const { msgDiv, metaDiv } = appendMessage('', 'bot-message', true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: history })
                });

                const data = await response.json();

                if (data.reply) {
                    history.push({ role: 'assistant', content: data.reply, time: getFormattedTime() });
                    saveChat(chatId, history);
                    streamMarkdownText(msgDiv, data.reply, metaDiv);
                } else {
                    history.pop();
                    saveChat(chatId, history);
                    msgDiv.classList.remove('thinking');
                    msgDiv.textContent = data.error || 'No response received.';
                }
            } catch (err) {
                history.pop();
                saveChat(chatId, history);
                msgDiv.classList.remove('thinking');
                msgDiv.textContent = 'Server connection failed. Please try again.';
            } finally {
                sendBtn.disabled = false;
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;
            handleSubmit(message);
        });

        initChats();

        // ---- PWA: service worker + install button ----
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        let deferredInstall = null;
        const installRow = document.getElementById('install-row');
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredInstall = e;
            installRow.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredInstall) return;
            deferredInstall.prompt();
            await deferredInstall.userChoice;
            deferredInstall = null;
            installRow.style.display = 'none';
        });

        window.addEventListener('appinstalled', () => {
            deferredInstall = null;
            installRow.style.display = 'none';
        });
    </script>
</body>
</html>
